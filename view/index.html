<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .title }}</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/static/lib/iziToast/iziToast.css">
    <link rel="stylesheet" href="/static/index.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
        <header class="mb-8">
            <h1 class="text-3xl font-bold leading-tight text-white sm:text-4xl">{{ .title }}</h1>
        </header>

        <div class="layout-panels">
            <section class="orderbook-panel rounded-3xl border border-slate-800/80 bg-slate-900/70 shadow-2xl shadow-slate-950/60 backdrop-blur-xl">
                <div class="border-b border-slate-800/80 px-6 py-4">
                    <p class="text-lg font-semibold text-white">板情報</p>
                </div>
                <div class="overflow-hidden px-2 pb-4 pt-2 sm:px-4">
                    <div class="overflow-auto rounded-2xl border border-slate-800/80 bg-slate-950/40 shadow-inner shadow-slate-950/50">
                        <table class="w-full border-separate border-spacing-y-2 text-xs sm:text-sm">
                            <thead class="text-slate-300">
                                <tr class="text-left">
                                    <th class="px-3 py-2 text-right font-semibold tracking-wide">売気配</th>
                                    <th class="px-3 py-2 text-center font-semibold tracking-wide">価格</th>
                                    <th class="px-3 py-2 text-left font-semibold tracking-wide">買気配</th>
                                </tr>
                            </thead>
                            <tbody id="orderbook-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <div class="side-panel-group">
                <section id="cancel" class="cancel-panel rounded-3xl border border-slate-800/80 bg-slate-900/70 px-6 py-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-colors duration-200">
                    <div class="mb-4">
                        <h2 class="text-xl font-semibold text-white">注文取消</h2>
                    </div>
                    <div class="cancel__checkboxes grid grid-cols-1 gap-3">
                        <label class="group flex items-center justify-between gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-sky-500/70 hover:shadow-sky-900/50">
                            <span class="text-sm font-semibold text-white">買建 (ロング)</span>
                            <input type="checkbox" id="cancel__long" class="h-5 w-5 accent-sky-400">
                        </label>
                        <label class="group flex items-center justify-between gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-sky-500/70 hover:shadow-sky-900/50">
                            <span class="text-sm font-semibold text-white">売建 (ショート)</span>
                            <input type="checkbox" id="cancel__short" class="h-5 w-5 accent-sky-400">
                        </label>
                    </div>
                    <button id="cancel__btn" class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-sky-500 via-indigo-500 to-fuchsia-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-900/60 transition hover:shadow-xl hover:shadow-sky-800/70 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-sky-300">
                        SEND
                    </button>
                </section>

                <section id="close" class="close-panel rounded-3xl border border-slate-800/80 bg-slate-900/70 px-6 py-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-colors duration-200">
                    <div class="mb-4">
                        <h2 class="text-xl font-semibold text-white">建玉返済</h2>
                    </div>

                    <label class="mt-1 flex items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-emerald-400/70 hover:shadow-emerald-900/50">
                        <input type="checkbox" id="close__only_profit" checked class="h-5 w-5 accent-emerald-400">
                        <span class="text-sm font-semibold text-white">利確可建玉のみ</span>
                    </label>

                    <div class="close__checkboxes mt-3 grid grid-cols-1 gap-3">
                        <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-emerald-400/70 hover:shadow-emerald-900/50">
                            <span class="text-sm font-semibold text-white">買建 (ロング)</span>
                            <input type="checkbox" id="close__long" class="h-5 w-5 accent-emerald-400">
                        </label>
                        <label class="flex items-center justify-between gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-emerald-400/70 hover:shadow-emerald-900/50">
                            <span class="text-sm font-semibold text-white">売建 (ショート)</span>
                            <input type="checkbox" id="close__short" class="h-5 w-5 accent-emerald-400">
                        </label>
                    </div>
                    <button id="close__btn" class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-emerald-900/60 transition hover:shadow-xl hover:shadow-emerald-800/70 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-emerald-300">
                        SEND
                    </button>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/lib/iziToast/iziToast.js"></script>
    <script src="/static/index.js"></script>
</body>

</html>
