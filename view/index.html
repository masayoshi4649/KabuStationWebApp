<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/lib/iziToast/iziToast.css">
    <link rel="stylesheet" href="/static/index.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased" data-onetick="{{ .onetick }}"
    data-current="{{ .current }}">
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
        <header class="mb-8">
            <h1 class="text-3xl font-bold leading-tight text-white sm:text-4xl">{{ .title }}</h1>
        </header>
        <!--
        [コンポーネント概要]
        #orderbook-panel は板情報を一覧表示するセクションです。
        ヘッダー行は固定ラベルを表示し、#orderbook-body に JS で価格・数量の行を追加します。
        -->
        <div class="layout-panels">
            <section id="orderbook-panel"
                class="rounded-3xl border border-slate-800/80 bg-slate-900/70 shadow-2xl shadow-slate-950/60 backdrop-blur-xl">
                <div class="border-b border-slate-800/80 px-6 py-4">
                    <p class="text-lg font-semibold text-white">板情報</p>
                </div>
                <div class="overflow-hidden px-2 pb-4 pt-2 sm:px-4">
                    <div
                        class="overflow-auto rounded-2xl border border-slate-800/80 bg-slate-950/40 shadow-inner shadow-slate-950/50">
                        <table class="w-full border-separate border-spacing-y-2 text-xs sm:text-sm">
                            <thead class="text-slate-300">
                                <tr class="text-left">
                                    <th class="px-3 py-2 text-right font-semibold tracking-wide">売数量</th>
                                    <th class="px-3 py-2 text-center font-semibold tracking-wide">価格</th>
                                    <th class="px-3 py-2 text-left font-semibold tracking-wide">買数量</th>
                                </tr>
                            </thead>
                            <tbody id="orderbook-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="flex flex-col gap-5 xl:gap-6">
                <!--
                [コンポーネント概要]
                #open は新しいレイアウト用のセクションです。
                上部を左右に分割し、左をAエリア、右をBエリアとします。下部をCエリアとします。
                -->
                <section id="open"
                    class="rounded-3xl border border-slate-800/80 bg-slate-900/70 px-6 py-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-colors duration-200">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-semibold text-white">即時注文（指値 / 逆指値）</h2>
                            <p class="text-xs text-slate-400">開始価格と数量を指定し、方向と種別を選んで即時発注します。</p>
                        </div>
                        <span
                            class="rounded-full bg-slate-800 px-3 py-1 text-[11px] font-semibold text-slate-100">即時発注</span>
                    </div>
                    <div class="mt-4 flex flex-col gap-4">
                        <div class="grid gap-4 sm:grid-cols-2 open__top-grid">
                            <div
                                class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4 min-h-[120px] flex flex-col gap-3 open-area open-area--a">
                                <div>
                                    <p class="text-xs font-semibold text-slate-300">方向</p>
                                    <div class="mt-2 flex flex-col gap-2 items-start">
                                        <label class="cursor-pointer w-full max-w-[100px]">
                                            <input type="radio" name="immediate__direction" value="buy"
                                                class="peer sr-only" checked>
                                            <div
                                                class="flex h-[25px] max-h-[25px] w-full max-w-[100px] items-center justify-center rounded-xl border border-slate-700 bg-slate-800/80 text-center text-sm font-semibold text-rose-100 shadow peer-checked:border-rose-300 peer-checked:text-rose-200 peer-checked:shadow-rose-800/60">
                                                買い
                                            </div>
                                        </label>
                                        <label class="cursor-pointer w-full max-w-[100px]">
                                            <input type="radio" name="immediate__direction" value="sell"
                                                class="peer sr-only">
                                            <div
                                                class="flex h-[25px] max-h-[25px] w-full max-w-[100px] items-center justify-center rounded-xl border border-slate-700 bg-slate-800/80 text-center text-sm font-semibold text-blue-100 shadow peer-checked:border-blue-300 peer-checked:text-blue-200 peer-checked:shadow-blue-800/60">
                                                売り
                                            </div>
                                        </label>
                                    </div>
                                </div>
                                <div>
                                    <p class="text-xs font-semibold text-slate-300">種別</p>
                                    <div class="mt-2 flex flex-col gap-2 items-start">
                                        <label class="cursor-pointer w-full max-w-[100px]">
                                            <input type="radio" name="immediate__type" value="limit"
                                                class="peer sr-only" checked>
                                            <div
                                                class="flex h-[25px] max-h-[25px] w-full max-w-[100px] items-center justify-center rounded-xl border border-slate-700 bg-slate-800/80 text-center text-sm font-semibold text-white shadow peer-checked:border-emerald-300 peer-checked:text-emerald-200 peer-checked:shadow-emerald-800/60">
                                                指値
                                            </div>
                                        </label>
                                        <label class="cursor-pointer w-full max-w-[100px]">
                                            <input type="radio" name="immediate__type" value="stop"
                                                class="peer sr-only">
                                            <div
                                                class="flex h-[25px] max-h-[25px] w-full max-w-[100px] items-center justify-center rounded-xl border border-slate-700 bg-slate-800/80 text-center text-sm font-semibold text-white shadow peer-checked:border-amber-300 peer-checked:text-amber-100 peer-checked:shadow-amber-800/60">
                                                逆指値
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div
                                class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4 min-h-[120px] flex flex-col gap-3">
                                <label
                                    class="flex flex-col gap-1 rounded-2xl border border-slate-800 bg-slate-900/80 px-4 py-3 shadow-inner shadow-slate-950/70">
                                    <span class="text-xs font-semibold text-slate-300">開始価格</span>
                                    <div class="flex flex-col gap-2">
                                        <div class="flex w-full overflow-hidden rounded-lg border border-slate-700">
                                            <button type="button" data-immediate-start-step="1"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">+{{
                                                .onetick }}</button>
                                            <button type="button" data-immediate-start-step="10"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800">+{{
                                                .onetick }}</button>
                                        </div>
                                        <input type="number" inputmode="decimal" id="immediate__start_price"
                                            value="{{ .current }}"
                                            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-semibold text-white focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                                            placeholder="{{ .current }}">
                                        <div class="flex w-full overflow-hidden rounded-lg border border-slate-700">
                                            <button type="button" data-immediate-start-step="-1"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">-{{
                                                .onetick }}</button>
                                            <button type="button" data-immediate-start-step="-10"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800">-{{
                                                .onetick }}</button>
                                        </div>
                                    </div>
                                </label>
                                <div
                                    class="rounded-2xl border border-slate-800 bg-slate-900/80 px-4 py-3 shadow-inner shadow-slate-950/70">
                                    <p class="text-xs font-semibold text-slate-300">間隔</p>
                                    <div class="mt-2 flex flex-col gap-2">
                                        <div class="flex w-full overflow-hidden rounded-lg border border-slate-700">
                                            <button type="button" id="immediate__interval_up"
                                                class="w-1/2 px-2 py-1.5 text-sm font-semibold text-slate-100 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">＋</button>
                                            <button type="button" id="immediate__interval_down"
                                                class="w-1/2 px-2 py-1.5 text-sm font-semibold text-slate-100 transition hover:border-slate-500 hover:bg-slate-800">－</button>
                                        </div>
                                        <input type="number" inputmode="decimal" id="immediate__interval"
                                            value="{{ .onetick }}"
                                            class="w-full min-w-[110px] rounded-xl border border-slate-700 bg-slate-950 px-2.5 py-2 text-center text-base font-bold text-white focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                                            step="{{ .onetick }}" placeholder="{{ .onetick }}">
                                    </div>
                                </div>
                                <label
                                    class="flex flex-col gap-1 rounded-2xl border border-slate-800 bg-slate-900/80 px-4 py-3 shadow-inner shadow-slate-950/70">
                                    <span class="text-xs font-semibold text-slate-300">数量</span>
                                    <div class="flex flex-col gap-2">
                                        <div class="flex w-full overflow-hidden rounded-lg border border-slate-700">
                                            <button type="button" data-immediate-size-delta="1"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">+1</button>
                                            <button type="button" data-immediate-size-delta="5"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">+5</button>
                                            <button type="button" data-immediate-size-delta="10"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800">+10</button>
                                        </div>
                                        <input type="number" id="immediate__size" value="1"
                                            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-semibold text-white focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/40"
                                            min="1">
                                        <div class="flex w-full overflow-hidden rounded-lg border border-slate-700">
                                            <button type="button" data-immediate-size-delta="-1"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">-1</button>
                                            <button type="button" data-immediate-size-delta="-5"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800 border-r border-slate-700">-5</button>
                                            <button type="button" data-immediate-size-delta="-10"
                                                class="flex-1 px-3 py-1 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800">-10</button>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <div
                            class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4 min-h-[120px] flex flex-col gap-4">
                            <div class="flex items-center justify-between">
                                <p class="text-xs font-semibold text-slate-300">プレビュー</p>
                                <span class="text-[11px] text-slate-400">即時注文と間隔に合わせて表示</span>
                            </div>
                            <div class="rounded-xl bg-slate-950/70 p-3 text-slate-100 shadow"
                                id="immediate__preview_box">
                                <p class="text-[11px] font-semibold" id="immediate__preview_label">注文内容</p>
                                <p class="mt-1 text-lg font-bold tracking-tight" id="immediate__preview_text">---</p>
                            </div>
                            <button id="open__btn"
                                class="inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-rose-500 via-amber-500 to-emerald-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-900/60 transition hover:shadow-xl hover:shadow-rose-900/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-amber-300">
                                発注
                            </button>
                        </div>
                    </div>
                </section>
                <!--
                [コンポーネント概要]
                #cancel は未約定注文の一括キャンセルを行うセクションです。
                cancel__long / cancel__short のトグルで買い・売りの対象を切り替えます。
                cancel__btn で選択状態に沿ってキャンセルリクエストを送信します。
                -->
                <section id="cancel"
                    class="rounded-3xl border border-slate-800/80 bg-slate-900/70 px-6 py-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-colors duration-200">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-semibold text-white">注文取消</h2>
                            <p class="text-xs text-slate-400">指定方向の建玉関連注文を即時に取消します。</p>
                        </div>
                        <span
                            class="rounded-full bg-slate-800 px-3 py-1 text-[11px] font-semibold text-slate-100">即時取消</span>
                    </div>
                    <div class="mt-3 grid grid-cols-1 gap-3">
                        <label
                            class="group flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-sky-500/70 hover:shadow-sky-900/50">
                            <span class="text-sm font-semibold text-white">買建</span>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="cancel__long" class="peer sr-only">
                                <div
                                    class="relative h-6 w-11 rounded-full border border-slate-700 bg-slate-800 transition peer-focus:ring-2 peer-focus:ring-sky-300 peer-checked:border-sky-300 peer-checked:bg-sky-500 after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-slate-400 after:bg-white after:transition-transform after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white">
                                </div>
                            </div>
                        </label>
                        <label
                            class="group flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-sky-500/70 hover:shadow-sky-900/50">
                            <span class="text-sm font-semibold text-white">売建</span>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="cancel__short" class="peer sr-only">
                                <div
                                    class="relative h-6 w-11 rounded-full border border-slate-700 bg-slate-800 transition peer-focus:ring-2 peer-focus:ring-sky-300 peer-checked:border-sky-300 peer-checked:bg-sky-500 after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-slate-400 after:bg-white after:transition-transform after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white">
                                </div>
                            </div>
                        </label>
                    </div>
                    <button id="cancel__btn"
                        class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-sky-500 via-indigo-500 to-fuchsia-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-900/60 transition hover:shadow-xl hover:shadow-sky-800/70 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-sky-300">
                        取 消
                    </button>
                </section>
                <!--
                [コンポーネント概要]
                #close は保有ポジションを決済するセクションです。
                close__only_profit で利益側のみ決済するかを指定し、close__long / close__short で方向を選択します。
                close__btn を押すと設定に沿った決済注文を送信します。
                -->
                <section id="close"
                    class="rounded-3xl border border-slate-800/80 bg-slate-900/70 px-6 py-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-colors duration-200">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-semibold text-white">建玉返済</h2>
                            <p class="text-xs text-slate-400">保有建玉の決済方向を指定し、一括返済します。</p>
                        </div>
                        <span
                            class="rounded-full bg-slate-800 px-3 py-1 text-[11px] font-semibold text-slate-100">決済</span>
                    </div>
                    <label
                        class="mt-2 flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-teal-400/70 hover:shadow-teal-900/50">
                        <span class="text-sm font-semibold text-white">含み益のみ返済</span>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="close__only_profit" checked class="peer sr-only">
                            <div
                                class="relative h-6 w-11 rounded-full border border-slate-700 bg-slate-800 transition peer-focus:ring-2 peer-focus:ring-teal-300 peer-checked:border-teal-300 peer-checked:bg-teal-500 after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-slate-400 after:bg-white after:transition-transform after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white">
                            </div>
                        </div>
                    </label>
                    <div class="mt-3 grid grid-cols-1 gap-3">
                        <label
                            class="flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-emerald-400/70 hover:shadow-emerald-900/50">
                            <span class="text-sm font-semibold text-white">買建</span>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="close__long" class="peer sr-only">
                                <div
                                    class="relative h-6 w-11 rounded-full border border-slate-700 bg-slate-800 transition peer-focus:ring-2 peer-focus:ring-emerald-300 peer-checked:border-emerald-300 peer-checked:bg-emerald-500 after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-slate-400 after:bg-white after:transition-transform after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white">
                                </div>
                            </div>
                        </label>
                        <label
                            class="flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3 shadow-inner shadow-slate-950/70 transition hover:border-emerald-400/70 hover:shadow-emerald-900/50">
                            <span class="text-sm font-semibold text-white">売建</span>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="close__short" class="peer sr-only">
                                <div
                                    class="relative h-6 w-11 rounded-full border border-slate-700 bg-slate-800 transition peer-focus:ring-2 peer-focus:ring-emerald-300 peer-checked:border-emerald-300 peer-checked:bg-emerald-500 after:absolute after:top-[2px] after:left-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-slate-400 after:bg-white after:transition-transform after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white">
                                </div>
                            </div>
                        </label>
                    </div>
                    <button id="close__btn"
                        class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-emerald-900/60 transition hover:shadow-xl hover:shadow-emerald-800/70 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-950 focus:ring-emerald-300">
                        返済
                    </button>
                </section>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/lib/iziToast/iziToast.js"></script>
    <script src="/static/index.js"></script>
</body>

</html>
